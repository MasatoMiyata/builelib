name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked
      - name: Run public input API and WEBPRO example tests
        run: >-
          uv run pytest
          tests/test_input_public_api.py
          tests/test_webpro_examples.py
          -q
